[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "clusterops"
version = "0.3.0+cc0"
description = "CPU affinity and optional GPU helpers for CC_ cluster jobs"
license = "MIT"
authors = ["CONSOLIDARE CONTINUUM <igareosh@igareosh.com>"]
homepage = "https://github.com/Consolidare-Continuum/ClusterOps"
documentation = "https://github.com/Consolidare-Continuum/ClusterOps"
readme = "README.md"
repository = "https://github.com/Consolidare-Continuum/ClusterOps"
keywords = ["cpu-affinity", "cluster", "multiprocessing", "gpu", "cc_"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: System :: Distributed Computing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
]

[tool.poetry.dependencies]
python = "^3.10"
loguru = "*"
tenacity = "*"
psutil = "*"
pathos = "*"
ray = { version = "*", optional = true }
gputil = { version = "*", optional = true }

[tool.poetry.extras]
gpu = ["ray", "gputil"]

[tool.poetry.group.lint.dependencies]
ruff = "^0.1.6"
types-toml = "^0.10.8.1"
types-redis = "^4.3.21.6"
types-pytz = "^2023.3.0.0"
black = "^23.1.0"
types-chardet = "^5.0.4.6"
mypy-protobuf = "^3.0.0"


[tool.autopep8]
max_line_length = 80
ignore = "E501,W6"  # or ["E501", "W6"]
in-place = true
recursive = true
aggressive = 3


[tool.ruff]
line-length = 70

[tool.black]
line-length = 70
target-version = ['py38']
preview = true
